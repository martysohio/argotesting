apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: basic-nginx
  namespace: anynamespace
  annotations:
    link.argocd.argoproj.io/external-link: http://google.com
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: app-any-namespace

  source:
    repoURL: https://github.com/martysohio/argotesting.git
    targetRevision: main
    path: anynamespace
    directory:
      exclude: 'any-namespace-app.yaml' # Prevents the app from syncing itself

  destination:
    # server: http://cluster-terraform:8001
    namespace: anynamespace

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: app-any-namespace
  namespace: argocd
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  destinations:
  - namespace: '*'
    server: '*'
  sourceNamespaces:
  - /^((?!kube-system).)*$/
  sourceRepos:
  - '*'
---