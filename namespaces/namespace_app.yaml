apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: control-plane-namespaces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/martysohio/argotesting.git
    targetRevision: HEAD
    path: namespaces
    directory:
      recurse: true
      exclude: 'namespace_app.yaml' # Prevents the app from syncing itself
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true