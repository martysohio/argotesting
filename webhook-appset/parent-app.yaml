apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: webhook-appset
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://github.com/martysohio/argotesting.git
    targetRevision: main
    path: webhook-appset
    directory:
      include: 'appset.yaml' # Only deploy the ApplicationSet, not parent-app.yaml or the app manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
