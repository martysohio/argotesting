apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/martysohio/argotesting.git
    targetRevision: main
    path: app-of-apps/manifests/nginx-frontend
  destination:
    name: argo1
    namespace: nginx-frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
